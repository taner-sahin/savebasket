{% load static %}

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>KUTAY | Build Your Future</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'products:home' %}">
            KUTAY
        </a>

        <!-- Kategoriler -->

        <ul class="navbar-nav me-auto">

            {% for category in nav_categories %}

                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'products:category_detail' category.slug %}">
                        {{ category.name }}
                    </a>
                </li>

            {% endfor %}

        </ul>

        <!-- Auth Butonları -->

       <!-- Auth Butonları -->
<div class="d-flex gap-2 align-items-center">

    {% if user.is_authenticated %}

        <span class="text-white small">
            Hoş geldin, {{ user.username }}
        </span>

        <form method="POST" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">
                Çıkış Yap
            </button>
        </form>

    {% else %}

        <a href="{% url 'accounts:login' %}" class="btn btn-outline-light btn-sm">
            Giriş Yap
        </a>

        <a href="{% url 'accounts:register' %}" class="btn btn-light btn-sm">
            Üye Ol
        </a>

    {% endif %}

</div>

    </div>
</nav>

<main class="container py-4">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
