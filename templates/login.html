{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <h2 class="mb-4 text-center">Giriş Yap</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-dark w-100">
                Giriş Yap
            </button>
        </form>

        <p class="text-center mt-3">
            Hesabın yok mu?
            <a href="{% url 'accounts:register' %}">
                Üye Ol
            </a>
        </p>

    </div>
</div>

{% endblock %}
